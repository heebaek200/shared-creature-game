server:
  servlet:
    session:
      tracking-modes: cookie    # 세션 번호를 쿠키로만 전달 (주소에 ;jsessionid를 붙이지 않음)

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sharedcreature
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB      # 파일 하나의 최대 크기
      max-request-size: 11MB   # 요청 전체(파일 + 입력값)의 최대 크기
  jpa:
    open-in-view: false # OSIV 비적용. 트랜잭션이 끝나면 영속성 컨텍스트 지연 로딩 불가.
    properties:
      hibernate:
        default_batch_fetch_size: 100
  session:
    store-type: jdbc
    timeout: 7d
    jdbc:
      initialize-schema: never

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth2/callback/google}

auth:
  initial-super-admin:
    provider: ${INITIAL_SUPER_ADMIN_PROVIDER:}
    provider-user-id: ${INITIAL_SUPER_ADMIN_PROVIDER_USER_ID:}

portone:
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  api-secret: ${PORTONE_API_SECRET:}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
  api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}

ngrok:
  domain-uri: ${NGROK_DOMAIN_URI:}

app:
  scheduler:
    enabled: false  # 스케쥴러(이 프로젝트에서는 시즌 및 퀘스트 갱신 역할) 기능 활성화 여부
