server:
  port: 8080

logging:
  level:
    root: INFO
    com.team.sharedcreature: DEBUG

spring:
  # 복수 Scheduler의 5분 Cron을 실행할 별도 스레드 풀을 설정한다.
  task:
    scheduling:
      pool:
        size: 6
      thread-name-prefix: sharedcreature-scheduler-

  # 데이터베이스 연결 (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DEV_DB_URL:jdbc:mysql://localhost:3306/shared_creature_game?serverTimezone=Asia/Seoul}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}

  # JPA 설정
  jpa:
    hibernate:
      # 개발 환경에서는 없는 테이블과 컬럼만 추가한다.
      ddl-auto: update
    # 실행되는 SQL을 콘솔에 출력한다.
    show-sql: true
    properties:
      hibernate:
        format_sql: true    # 출력되는 SQL을 콘솔창에 줄바꿈해 보기 좋게 표시
    # JPA 테이블 준비 후 퀘스트 카탈로그만 초기화한다.
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations:
        - classpath:db/quest-catalog.sql

app:
  scheduler:
    # dev에서도 별도 환경변수 없이 기동 복구·주기 실행을 활성화한다.
    enabled: true
    photo-retention-enabled: true
    payment-webhook-enabled: true
    # #22 실제 환불 상태 복구 연동이 완료되면 별도 검증 후 true로 전환한다.
    refund-reconciliation-enabled: false
