server:
  port: 8080

logging:
  level:
    root: INFO                  # 스프링과 라이브러리는 INFO 이상만 콘솔에 출력
    com.team.sharedcreature: DEBUG    # 내가 작성한 코드는 DEBUG 이상까지 출력

spring:
  # 여러 개의 5분 Cron이 동시에 도착해도 하나의 긴 작업이 나머지를 막지 않도록 설정한다.
  task:
    scheduling:
      pool:
        size: 6
      thread-name-prefix: sharedcreature-scheduler-

  # 팀원 PC의 로컬 MySQL을 사용한다.
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/shared_creature_game?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${LOCAL_DB_USERNAME:}
    password: ${LOCAL_DB_PASSWORD:}

  # JPA 설정
  jpa:
    hibernate:
      # 로컬 학습 환경에서는 기존 데이터와 호환되는 변경만 반영한다.
      ddl-auto: update
    # 실행되는 SQL을 콘솔에 출력한다.
    show-sql: true
    properties:
      hibernate:
        format_sql: true    # 출력되는 SQL을 콘솔창에 줄바꿈해 보기 좋게 표시
    # data.sql을 테이블 생성 후에 실행한다.
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/special-schema.sql
      data-locations:
        - classpath:db/data.sql # 팀 로컬 시연용 시즌·종·상점 시드
        - classpath:db/quest-catalog.sql # 퀘스트 템플릿·버전 시드

app:
  scheduler:
    # local에서는 서버 기동 시 누락 작업을 복구하고 가동 중에는 자동 점검한다.
    enabled: true
    photo-retention-enabled: true
    payment-webhook-enabled: true
    # #22 환불 업무 Bean이 병합된 뒤 실DB 검증까지 마치기 전에는 활성화하지 않는다.
    refund-reconciliation-enabled: false
