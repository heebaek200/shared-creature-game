server:
  port: 8080

logging:
  level:
    root: INFO                  # 스프링과 라이브러리는 INFO 이상만 콘솔에 출력
    com.team.sharedcreature: DEBUG    # 내가 작성한 코드는 DEBUG 이상까지 출력

spring:
  # 팀원 PC의 로컬 MySQL을 사용한다.
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/shared_creature_game?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${LOCAL_DB_USERNAME:}
    password: ${LOCAL_DB_PASSWORD:}

  # JPA 설정
  jpa:
    hibernate:
      # 로컬 학습 환경에서는 기존 데이터와 호환되는 변경만 반영한다.
      ddl-auto: update
    # 실행되는 SQL을 콘솔에 출력한다.
    show-sql: true
    properties:
      hibernate:
        format_sql: true    # 출력되는 SQL을 콘솔창에 줄바꿈해 보기 좋게 표시
    # data.sql을 테이블 생성 후에 실행한다.
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/special-schema.sql
      data-locations:
        - classpath:db/data.sql # 서버 시작 시 이 파일 실행

app:
  scheduler:
    enabled: true  # 스케쥴러(이 프로젝트에서는 시즌 및 퀘스트 갱신 역할) 기능 활성화 여부
